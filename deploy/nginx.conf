# nginx site for the storefront. setup.sh copies this to /etc/nginx/sites-available/
# and substitutes __DOMAIN__ and __BACKEND_DIR__; certbot then adds the HTTPS blocks.

upstream gad_frontend {
    server 127.0.0.1:3000 fail_timeout=0;
}

# www -> bare domain
server {
    listen 80;
    listen [::]:80;
    server_name www.__DOMAIN__;
    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 10m;

    # Product images live on this server next to the API: serve them straight
    # from disk instead of proxying them through Next.js.
    location /media/ {
        alias __BACKEND_DIR__/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://gad_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
